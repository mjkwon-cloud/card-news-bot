name: Daily Card News

on:
  schedule:
    # 매일 02:00 UTC = 11:00 KST (점심 피크 직전)
    - cron: "0 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome for Puppeteer
        run: npx puppeteer browsers install chrome

      - name: Generate + render today's card news
        env:
          CARD_NEWS_LLM_API_KEY: ${{ secrets.CARD_NEWS_LLM_API_KEY }}
          CARD_NEWS_LLM_BASE_URL: ${{ secrets.CARD_NEWS_LLM_BASE_URL }}
          CARD_NEWS_LLM_MODEL: ${{ secrets.CARD_NEWS_LLM_MODEL }}
        run: npm run run

      - name: Commit and push result
        run: |
          git config user.name "card-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add out/
          if git diff --cached --quiet; then
            echo "오늘은 휴무일이거나 변경 사항이 없습니다 — 커밋 생략."
          else
            git commit -m "카드뉴스 자동 생성: $(date -u +%Y-%m-%d)"
            git push
          fi
